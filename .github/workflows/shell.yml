name: shell

on: [push, workflow_dispatch]

jobs:
  runshell:
    runs-on: macos-latest
    name: Start a Solaris shell

    steps:
      - name: Starting a solaris VM
        uses: vmactions/solaris-vm@v1
        with:
          run: |
            pwd
            ls -lah
            whoami
            env
            cat /etc/release
            echo "OK"

